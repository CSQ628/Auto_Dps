name: Windows checks and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt pyinstaller==6.15.0
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/*.test.cjs
      - run: python -X utf8 tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Auto_Dps-Windows-x64
          path: |
            dist/Auto_Dps-*-Windows-x64.zip
            dist/*.sha256
